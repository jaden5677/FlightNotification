server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve built assets directly; fall back to index.html for Angular routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for fingerprinted (outputHashing) build assets.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
