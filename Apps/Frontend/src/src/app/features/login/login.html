<div class="login-page brand-gradient-panel">
  <section class="login-card">
    <div class="airline-logo">
      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
        <path
          fill="#e4007c"
          d="M2 14c4-1 7-3 9-6 1 2 3 3 5 3-1 2-3 4-6 5 3 0 5-1 7-3-1 4-5 7-10 7-3 0-5-1-6-3 1 0 2 0 3-1-2 0-3-1-4-2 1 0 2 0 3-1-1-1-2-2-2-3z"
        />
      </svg>
      <span>Caribbean Airlines</span>
    </div>

    <h1>Welcome Admin</h1>

    <form class="login-form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Enter your email address</mat-label>
        <input matInput type="email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Enter your password</mat-label>
        <input matInput type="password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" required />
      </mat-form-field>

      @if (error()) {
        <p class="login-error">{{ error() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" class="full-width sign-in" [disabled]="submitting()">
        Sign In
      </button>

      <a class="forgot-password" href="javascript:void(0)">Forgot password?</a>

      <div class="divider"><span>OR</span></div>

      <p class="sso-hint">Sign in with your Caribbean Airlines Account</p>

      <button
        mat-stroked-button
        type="button"
        class="full-width microsoft-button"
        [disabled]="submitting()"
        (click)="continueWithMicrosoft()"
      >
        <span class="ms-logo" aria-hidden="true">
          <span class="ms-sq ms-r"></span><span class="ms-sq ms-g"></span>
          <span class="ms-sq ms-b"></span><span class="ms-sq ms-y"></span>
        </span>
        Continue with Microsoft Account
      </button>

      <p class="secure-auth-note">
        <mat-icon inline>lock</mat-icon>
        Secure authentication via Microsoft Active Directory
      </p>
    </form>
  </section>
</div>
